spring.application.name=edusolution

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default-schema=public

# jwt
security.jwt.secret-key = ${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time = ${SECURITY_JWT_EXPIRATION_EXPIRATION_TIME}

# cors
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=POST,GET,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Content-Type,X-Request-ID,Authorization
cors.allow-credentials=true

#aws Configuration
spring.cloud.aws.region.static = ${CLOUD_AWS_REGION}
spring.cloud.aws.credentials.secret-key = ${CLOUD_AWS_CREDENTIALS_SECRET_KEY}
spring.cloud.aws.credentials.access-key = ${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
cloudfare.r2.endpoint = ${CLOUDFARE_R2_ENDPOINT}

#S3 Configuration
spring.cloud.aws.bucket-name = ${CLOUD_AWS_BUCKET_NAME}

spring.servlet.multipart.max-file-size=5MB

resend.api.key = ${RESEND_API_KEY}

# Admin Config
admin.cred.username = ${ADMIN_CRED_USERNAME}
admin.cred.password = ${ADMIN_CRED_PASSWORD}
admin.cred.email = ${ADMIN_CRED_EMAIL}

